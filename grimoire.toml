# Grimoire book configuration for the @deckyard/vies documentation.

[book]
title = "@deckyard/vies"
description = "EU VAT number validation through the European Commission's VIES service"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "meridian"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-vies/"
repoUrl = "https://github.com/deckyard/deck-vies"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-vies/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
